openapi: 3.1.0
info:
  title: ShwayFit API
  version: 0.1.0
  description: The shared contract for the React frontend and Go API.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is available.
  /me:
    get:
      operationId: getCurrentIdentity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The verified Firebase identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /session/revoke:
    post:
      operationId: revokeCurrentUserSessions
      summary: Revokes the current trainer's Firebase sessions on all devices.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: Firebase session revocation is unavailable.
  /organizations:
    post:
      operationId: createFirstOrganization
      summary: Creates the caller's only POC organization and owner membership.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/OrganizationAlreadyExists' }
  /organizations/current:
    get:
      operationId: getCurrentOrganization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's active organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
  /organizations/current/trainer-profile:
    get:
      operationId: getCurrentTrainerProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's trainer contact profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerProfile' }
    patch:
      operationId: updateCurrentTrainerProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainerProfileInput' }
      responses:
        '200':
          description: Updated trainer contact profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerProfile' }
  /organizations/current/clients:
    get:
      operationId: listClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clients the caller is assigned to access.
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
    post:
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: Client created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
  /organizations/current/clients/{clientID}:
    parameters:
      - name: clientID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Client record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
    patch:
      operationId: updateClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: Client updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
  /organizations/current/clients/{clientID}/packages:
    parameters:
      - name: clientID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listClientPackages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current and historical client package records.
          content:
            application/json:
              schema:
                type: object
                required: [packages]
                properties:
                  packages:
                    type: array
                    items: { $ref: '#/components/schemas/ClientPackage' }
    post:
      operationId: assignClientPackage
      summary: Assigns the selected active option as the client's one active package.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageOptionId]
              properties:
                packageOptionId: { type: string }
      responses:
        '201':
          description: Client package opened with an opening audit event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPackage' }
        '409':
          description: The option is archived or the client already has an active package.
  /organizations/current/package-options:
    get:
      operationId: listPackageOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reusable package options for the caller's organization.
          content:
            application/json:
              schema:
                type: object
                required: [packageOptions]
                properties:
                  packageOptions:
                    type: array
                    items: { $ref: '#/components/schemas/PackageOption' }
    post:
      operationId: createPackageOption
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageOptionInput' }
      responses:
        '201':
          description: Package option created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageOption' }
  /organizations/current/appointments:
    get:
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Appointments in the requested time range.
          content:
            application/json:
              schema:
                type: object
                required: [appointments]
                properties:
                  appointments:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
    post:
      operationId: createAppointment
      summary: Books an appointment without consuming a package session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentInput' }
      responses:
        '201':
          description: Appointment booked. Overlapping appointments are permitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '409':
          description: The client is archived or has no active package session remaining.
  /organizations/current/package-options/{optionID}/archive:
    parameters:
      - name: optionID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: archivePackageOption
      summary: Archives an option so it cannot be assigned to a future client package.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Package option archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageOption' }
  /organizations/current/appointments/{appointmentID}/complete:
    parameters:
      - name: appointmentID
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 8, maxLength: 200 }
    post:
      operationId: completeAppointment
      summary: Completes one scheduled appointment and atomically debits one package session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The completed appointment and its updated package balance. Retrying with the same key returns this result without another debit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentCompletion' }
        '409':
          description: The appointment is already complete, its key is reused, or its package has no remaining sessions.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    Identity:
      type: object
      required: [uid, email, emailVerified]
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
    Organization:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
    TrainerProfileInput:
      type: object
      properties:
        phone: { type: string, minLength: 7, maxLength: 40, pattern: '^[0-9+(). -]+$' }
    TrainerProfile:
      allOf:
        - $ref: '#/components/schemas/TrainerProfileInput'
        - type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
    ClientInput:
      type: object
      required: [firstName, lastName, status]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 7, maxLength: 40, pattern: '^[0-9+(). -]+$' }
        goals: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 4000 }
        preferredStartTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00' }
        preferredEndTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', example: '11:00' }
        heightCm: { type: number, minimum: 50, maximum: 300, example: 172 }
        startingWeightKg: { type: number, minimum: 20, maximum: 500, example: 72.5 }
        startingMeasurementDate: { type: string, format: date, example: '2026-09-17' }
        startingMeasurementNotes: { type: string, maxLength: 500 }
        status: { type: string, enum: [active, archived] }
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    PackageOptionInput:
      type: object
      required: [name, includedSessions]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        includedSessions: { type: integer, minimum: 1, maximum: 100 }
    PackageOption:
      allOf:
        - $ref: '#/components/schemas/PackageOptionInput'
        - type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, enum: [active, archived] }
    ClientPackage:
      type: object
      required: [id, packageOptionId, packageName, includedSessions, remainingSessions, status]
      properties:
        id: { type: string }
        packageOptionId: { type: string }
        packageName: { type: string }
        includedSessions: { type: integer }
        remainingSessions: { type: integer }
        status: { type: string, enum: [active, completed] }
    AppointmentInput:
      type: object
      required: [clientId, startAt, durationMinutes]
      properties:
        clientId: { type: string }
        startAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 15, maximum: 240, multipleOf: 5 }
        notes: { type: string, maxLength: 2000 }
    Appointment:
      allOf:
        - $ref: '#/components/schemas/AppointmentInput'
        - type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, enum: [scheduled, completed] }
    AppointmentCompletion:
      type: object
      required: [appointment, clientPackage]
      properties:
        appointment: { $ref: '#/components/schemas/Appointment' }
        clientPackage: { $ref: '#/components/schemas/ClientPackage' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthenticated:
      description: A valid Firebase ID token was not supplied.
      content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    OrganizationNotFound:
      description: The caller does not have an active organization membership.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OrganizationAlreadyExists:
      description: The caller has already completed POC organization provisioning.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
