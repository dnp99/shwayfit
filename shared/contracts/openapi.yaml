openapi: 3.1.0
info:
  title: ShwayFit API
  version: 0.1.0
  description: The shared contract for the React frontend and Go API.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is available.
  /me:
    get:
      operationId: getCurrentIdentity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The verified Firebase identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    Identity:
      type: object
      required: [uid, email, emailVerified]
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthenticated:
      description: A valid Firebase ID token was not supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
