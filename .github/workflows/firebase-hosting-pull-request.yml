name: Deploy Firebase Hosting preview
on: pull_request
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: shwayfit-f7f0b
  WORKLOAD_IDENTITY_PROVIDER: projects/552652876512/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOYER_SERVICE_ACCOUNT: github-actions-deployer@shwayfit-f7f0b.iam.gserviceaccount.com
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: >-
          npx --yes firebase-tools@latest hosting:channel:deploy
          "pr-${{ github.event.pull_request.number }}"
          --expires 7d
          --project "$PROJECT_ID"
