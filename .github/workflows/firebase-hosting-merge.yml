name: Deploy production
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: shwayfit-f7f0b
  REGION: northamerica-northeast1
  CLOUD_RUN_SERVICE: shwayfit-api
  WORKLOAD_IDENTITY_PROVIDER: projects/552652876512/locations/global/workloadIdentityPools/github-actions/providers/github-actions-shwayfit
  DEPLOYER_SERVICE_ACCOUNT: github-actions-deployer@shwayfit-f7f0b.iam.gserviceaccount.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate frontend
        run: npm --prefix frontend ci && npm --prefix frontend run lint && npm --prefix frontend run build
      - name: Validate backend
        working-directory: backend
        run: go test -race ./... && go vet ./...
      - name: Detect backend changes
        id: backend_changes
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- backend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes detected; skipping Cloud Run deployment."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Backend changes detected; Cloud Run deployment will run."
          fi
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy API to Cloud Run
        if: steps.backend_changes.outputs.changed == 'true'
        run: >-
          gcloud run deploy "$CLOUD_RUN_SERVICE"
          --source backend
          --project "$PROJECT_ID"
          --region "$REGION"
          --allow-unauthenticated
          --max-instances 1
          --min-instances 0
          --memory 256Mi
          --cpu 1
          --timeout 30s
      - name: Deploy frontend to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$PROJECT_ID"
